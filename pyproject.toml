[project]
name = "konoden-ai"
version = "0.4.0"
description = "Konoden AI — AI video editor (white-label ready)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]
screencast = ["playwright>=1.45"]

[project.scripts]
konoden = "konoden.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
